{% set name = "utilsforecast" %}
{% set version = "0.2.16" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: dca406231d002279562ae897dbcb9e419c2fc5bf48908be02834b3187ce5a52b

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools >=61.0
  run:
    - python
    - numpy
    - packaging
    - pandas <3.0.0
    - narwhals >=2.0
  run_constrained:
    # polars
    - polars <=1.31

test:
  imports:
    - utilsforecast
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/Nixtla/utilsforecast
  summary: Forecasting utilities
  license: Apache-2.0
  license_file: LICENSE
  license_family: APACHE
  description: Forecasting utilities
  dev_url: https://github.com/Nixtla/utilsforecast
  doc_url: https://nixtlaverse.nixtla.io/utilsforecast/index.html

extra:
  recipe-maintainers:
    - AzulGarza
    - jmoralez
